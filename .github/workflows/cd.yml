name: CD
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and package release
        id: release
        run: bash ./scripts/release.sh "$GITHUB_OUTPUT" "$GITHUB_REF" "$GITHUB_REF_NAME"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutomaticRoleCheck-${{ steps.release.outputs.archive_version }}
          path: ${{ steps.release.outputs.archive_path }}
          retention-days: 7
      - name: Validate release outputs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -n "${{ steps.release.outputs.notes_path }}"
          test -f "${{ steps.release.outputs.notes_path }}"
          test -n "${{ steps.release.outputs.archive_path }}"
          test -f "${{ steps.release.outputs.archive_path }}"
      - name: Print release outputs
        run: |
          echo "version=${{ steps.release.outputs.version }}"
          echo "archive_version=${{ steps.release.outputs.archive_version }}"
          echo "archive_path=${{ steps.release.outputs.archive_path }}"
      - name: Ensure tracked tree is clean after packaging
        run: bash ./scripts/check.sh worktree-clean
      - name: Create release and upload archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release.outputs.version }}
          body_path: ${{ steps.release.outputs.notes_path }}
          files: ${{ steps.release.outputs.archive_path }}
      - name: Publish to CurseForge
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: "448353"
        run: |
          bash ./scripts/publish-curseforge.sh \
            "${{ steps.release.outputs.archive_path }}" \
            "${{ steps.release.outputs.notes_path }}" \
            "${{ steps.release.outputs.version }}" \
            "AutomaticRoleCheck.toc"
