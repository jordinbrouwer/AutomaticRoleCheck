name: CD
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  package:
    name: Package and publish
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare and package release
        id: release
        run: bash ./scripts/release.sh "$GITHUB_OUTPUT" "$GITHUB_REF" "$GITHUB_REF_NAME"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ steps.release.outputs.archive_version }}
          path: ${{ steps.release.outputs.archive_path }}
          retention-days: 7
      - name: Validate release outputs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NOTES_PATH: ${{ steps.release.outputs.notes_path }}
          ARCHIVE_PATH: ${{ steps.release.outputs.archive_path }}
        run: |
          test -n "$NOTES_PATH"
          test -f "$NOTES_PATH"
          test -n "$ARCHIVE_PATH"
          test -f "$ARCHIVE_PATH"
      - name: Print release outputs
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCHIVE_VERSION: ${{ steps.release.outputs.archive_version }}
          ARCHIVE_PATH: ${{ steps.release.outputs.archive_path }}
        run: |
          echo "version=$VERSION"
          echo "archive_version=$ARCHIVE_VERSION"
          echo "archive_path=$ARCHIVE_PATH"
          {
            echo "### Release package"
            echo ""
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| version | \`$VERSION\` |"
            echo "| archive | \`$ARCHIVE_PATH\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure tracked tree is clean after packaging
        run: bash ./scripts/check.sh worktree-clean
      - name: Create release and upload archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release.outputs.version }}
          body_path: ${{ steps.release.outputs.notes_path }}
          files: ${{ steps.release.outputs.archive_path }}
      - name: Publish to CurseForge
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
          ARCHIVE_PATH: ${{ steps.release.outputs.archive_path }}
          NOTES_PATH: ${{ steps.release.outputs.notes_path }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bash ./scripts/publish-curseforge.sh "$ARCHIVE_PATH" "$NOTES_PATH" "$VERSION"
