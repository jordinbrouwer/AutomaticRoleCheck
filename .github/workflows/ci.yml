name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  discover:
    name: Discover checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - name: List check modes
        id: list
        run: |
          checks="$(bash ./scripts/check.sh list | jq -R . | jq -sc .)"
          echo "Discovered checks: $checks"
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.check }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Luacheck
        if: matrix.check == 'lint'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua-check
      - name: Install ShellCheck
        if: matrix.check == 'shell'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
      - name: Run ${{ matrix.check }} check
        env:
          CHECK_MODE: ${{ matrix.check }}
        run: bash ./scripts/check.sh "$CHECK_MODE"
